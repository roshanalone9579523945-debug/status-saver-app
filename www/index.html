<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Insta Font & Bio Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b16;color:#fff;font-family:Arial,sans-serif}
.app{max-width:600px;margin:auto;padding:18px 14px 90px}
.logo{text-align:center;padding:14px 0 8px}
.logo-icon{font-size:48px}
h1{margin:6px 0;color:#ff4f9a;font-size:25px}
.subtitle{color:#9da6bd;font-size:13px}
.tabs{display:flex;gap:8px;margin:20px 0 14px}
.tab{flex:1;border:0;border-radius:12px;padding:12px 5px;background:#151a2b;color:#aeb6cc;font-weight:bold}
.tab.active{background:linear-gradient(135deg,#ff3f91,#8b5cf6);color:white}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{white-space:nowrap;border:1px solid #252c42;background:#111628;color:#b9c2d8;border-radius:20px;padding:8px 13px}
.chip.active{background:#182d38;color:#29e7ff;border-color:#29e7ff}
.section{display:none}
.section.active{display:block}
.custom{background:#111628;border:1px solid #252c42;border-radius:16px;padding:14px;margin:8px 0 16px}
.custom label{display:block;color:#29e7ff;font-weight:bold;margin-bottom:8px}
input{width:100%;padding:13px;border:1px solid #303850;border-radius:11px;background:#080b16;color:#fff;font-size:16px;outline:none}
.preview{margin-top:12px;min-height:48px;padding:12px;border-radius:11px;background:#080b16;color:#fff;font-size:20px;word-break:break-word}
.ad{position:fixed;bottom:0;left:0;right:0;height:58px;background:#0e1220;border-top:1px solid #252c42;display:flex;align-items:center;justify-content:center;color:#66708a;font-size:12px}
.count{color:#29e7ff;font-size:13px;margin:8px 2px}
</style>
<style>#bioCategories{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 12px;scrollbar-width:none}#bioCategories::-webkit-scrollbar{display:none}#bioCategories .cat{flex:0 0 auto;border:1px solid #333;background:#151827;color:#ddd;border-radius:20px;padding:8px 13px;font-size:13px;font-weight:600}#bioCategories .cat.active{background:#ff2d8d;color:#fff;border-color:#ff2d8d;box-shadow:0 0 12px rgba(255,45,141,.25)}</style></head>
<body>
<div class="app">
  <div class="logo">
    <div class="logo-icon">✨</div>
    <h1>Insta Font & Bio Hub</h1>
    <div class="subtitle">Fonts • Bios • Hashtags</div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('fonts',this)">Fancy Fonts</button>
    <button class="tab" onclick="showTab('bios',this)">Insta Bios</button>
    <button class="tab" onclick="showTab('hashtags',this)">Hashtags</button>
  </div>

  <div id="fonts" class="section active">
    <div class="chips">
      <button class="chip active">All</button>
      <button class="chip">Attitude</button>
      <button class="chip">YPS & Style</button>
      <button class="chip">Tech & Dev</button>
      <button class="chip">Love & Vibes</button>
      <button class="chip">Gym & Fitness</button>
    </div>

    <div class="custom">
      <label>✨ Type here…</label>
      <input id="customText" placeholder="Enter your name or text" oninput="updatePreview()">
      <div class="preview" id="preview">Your stylish text will appear here</div>
    </div>
    <div class="count">Available: 300 Fancy Fonts</div>
<div id="fontList"></div>
  </div>

  <div id="bios" class="section">
    <div class="count">Available: 250 Insta Bios</div><div class="category-chips" id="bioCategories"><button class="cat active" data-cat="All">All</button><button class="cat" data-cat="😎 Attitude">😎 Attitude</button><button class="cat" data-cat="👑 Royal / Luxury">👑 Royal</button><button class="cat" data-cat="❤️ Love">❤️ Love</button><button class="cat" data-cat="💔 Broken">💔 Broken</button><button class="cat" data-cat="🧠 Deep / Thoughtful">🧠 Deep</button><button class="cat" data-cat="💪 Motivation">💪 Motivation</button><button class="cat" data-cat="🏋️ Gym / Fitness">🏋️ Gym</button><button class="cat" data-cat="💻 Tech / Developer">💻 Tech</button><button class="cat" data-cat="🎮 Gaming">🎮 Gaming</button><button class="cat" data-cat="✈️ Travel">✈️ Travel</button><button class="cat" data-cat="📸 Creator">📸 Creator</button><button class="cat" data-cat="🖤 Dark / Savage">🖤 Dark</button><button class="cat" data-cat="😄 Funny">😄 Funny</button><button class="cat" data-cat="🙏 Spiritual">🙏 Spiritual</button><button class="cat" data-cat="🇮🇳 Desi / Indian">🇮🇳 Desi</button><button class="cat" data-cat="💼 Business / Professional">💼 Business</button><button class="cat" data-cat="🌱 Simple / Minimal">🌱 Simple</button></div>
    <div id="bioList"></div>
  </div>

  <div id="hashtags" class="section">
    <div class="count">Trending Instagram Hashtags</div>
  </div>
</div>

<div class="ad">AD SPACE — TEST BANNER WILL APPEAR HERE</div>

<script>
function showTab(id,btn){
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}
function updatePreview(){
  const text=document.getElementById('customText').value;
  document.getElementById('preview').textContent=text||'Your stylish text will appear here';
}
</script>
<script src="data.js"></script>\n<script src="bios.js"></script>
<script>
(function(){
  function renderBios(){
    const box=document.getElementById('bioList');
    if(!box || !window.instaBios) return;
    box.innerHTML='';

    window.instaBios.forEach((bio)=>{
      const card=document.createElement('div');
      card.className='font-card';
      card.innerHTML='<div class="font-name">#'+bio.id+' • '+bio.category+'</div><div class="font-preview"></div><button class="copy-btn">Copy</button>';
      card.querySelector('.font-preview').textContent=bio.text;
      card.querySelector('.copy-btn').onclick=async()=>{
        try{await navigator.clipboard.writeText(bio.text)}catch(e){}
        card.querySelector('.copy-btn').textContent='Copied ✓';
        setTimeout(()=>card.querySelector('.copy-btn').textContent='Copy',1200);
      };
      box.appendChild(card);
    });
  }
  window.addEventListener('load',renderBios);

document.addEventListener('click',function(e){
  const btn=e.target.closest('#bioCategories .cat');
  if(!btn) return;

  document.querySelectorAll('#bioCategories .cat').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');

  const cat=btn.dataset.cat;
  const box=document.getElementById('bioList');
  if(!box || !window.instaBios) return;

  box.innerHTML='';

  window.instaBios
    .filter(bio=>cat==='All' || bio.category===cat)
    .forEach(bio=>{
      const card=document.createElement('div');
      card.className='font-card';
      card.innerHTML='<div class="font-name">#'+bio.id+' • '+bio.category+'</div><div class="font-preview"></div><button class="copy-btn">Copy</button>';

      card.querySelector('.font-preview').textContent=bio.text;

      card.querySelector('.copy-btn').onclick=async()=>{
        try{await navigator.clipboard.writeText(bio.text)}catch(e){}
        card.querySelector('.copy-btn').textContent='Copied ✓';
        setTimeout(()=>card.querySelector('.copy-btn').textContent='Copy',1200);
      };

      box.appendChild(card);
    });
});
})();
</script>\n
<style>
#fontList{display:grid;gap:10px;margin-top:10px}
.font-card{background:#111628;border:1px solid #252c42;border-radius:14px;padding:13px}
.font-name{font-size:11px;color:#29e7ff;margin-bottom:7px}
.font-preview{font-size:20px;line-height:1.45;word-break:break-word;margin-bottom:10px;min-height:29px}
.copy-btn{border:0;border-radius:9px;padding:8px 14px;background:linear-gradient(135deg,#ff3f91,#8b5cf6);color:#fff;font-weight:bold}
</style>
<script>
(function(){
  const deco=['✨','★','⚡','♥','☾','♛','✦','❖','♕','☀','❣','✧','♡','⚔','☯','♚','✪','✩','❀','❂'];

  function safeTransform(font,text){
    let styled='';
    try{
      const fn=eval('('+font.transform+')');
      styled=(font.prefix||'')+fn(text)+(font.suffix||'');
    }catch(e){}
    if(!styled.trim()) styled='✦ '+text+' ✦';
    return styled;
  }

  function renderFonts(){
    const box=document.getElementById('fontList');
    if(!box || !window.fancyFonts) return;

    const text=document.getElementById('customText')?.value || 'Roshan';
    const seen=new Set();
    box.innerHTML='';

    window.fancyFonts.forEach((font,i)=>{
      let styled=safeTransform(font,text);

      if(seen.has(styled)){
        const d=deco[i%deco.length];
        styled=d+' '+styled+' '+d+' '+(i+1);
      }

      while(seen.has(styled)){
        styled='✦ '+styled+' '+deco[i%deco.length];
      }

      seen.add(styled);

      const card=document.createElement('div');
      card.className='font-card';
      card.innerHTML='<div class="font-name">'+(i+1)+'. '+font.name+' • '+font.category+'</div><div class="font-preview"></div><button class="copy-btn">Copy</button>';

      card.querySelector('.font-preview').textContent=styled;

      card.querySelector('.copy-btn').onclick=async()=>{
        try{await navigator.clipboard.writeText(styled)}catch(e){}
        card.querySelector('.copy-btn').textContent='Copied ✓';
        setTimeout(()=>card.querySelector('.copy-btn').textContent='Copy',1200);
      };

      box.appendChild(card);
    });
  }

  window.addEventListener('load',renderFonts);
  window.renderFonts=renderFonts;

  const input=document.getElementById('customText');
  if(input) input.addEventListener('input',renderFonts);
})();
</script>
\n</body>\n</html>\n
